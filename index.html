<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>矛與盾：攔截</title>
<style>
:root{--c:#ffb648;--bg:#0c0f12;--pn:rgba(14,18,22,.92);--ln:rgba(255,255,255,.16);--tx:#eef1f3;--mu:#9aa4ad}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;color:inherit}
#view{position:fixed;inset:0}#view canvas{display:block;filter:contrast(1.05) saturate(1.04)}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));z-index:4}
.scr{position:fixed;inset:0;display:none;z-index:10}.scr.on{display:flex}
#game{z-index:5;display:none}#game.on{display:block}
#mute{position:fixed;right:10px;top:8px;z-index:60;width:34px;height:34px;border-radius:50%;background:rgba(14,18,22,.7);border:1px solid var(--ln);font-size:15px}
.btn{background:var(--tx);color:#111;border:0;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:2px;padding:12px 24px}
.btn.gh{background:transparent;color:var(--tx);border:1.5px solid rgba(255,255,255,.45)}
.btn:active{transform:scale(.97)}
/* 選單 */
#menu{background:linear-gradient(160deg,#141b22,#0b0e11 60%);align-items:center;justify-content:center;padding:16px;overflow:auto}
.mw{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:center}
.mh small{font-size:12px;letter-spacing:4px;color:var(--mu);font-weight:700}
.mh h1{font-size:40px;font-weight:900;letter-spacing:4px;margin:4px 0 8px}
.mh h1 em{font-style:normal;color:#ffb648}
.mh p{font-size:13.5px;line-height:1.7;color:#c9d1d9}
.mh .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#lvList{display:flex;flex-direction:column;gap:6px}
.lv{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:4px;padding:9px 12px}
.lv:active{background:rgba(255,255,255,.12)}
.lv .n{font-size:20px;font-weight:900;color:var(--mu)}.lv .tt{font-size:15px;font-weight:900}.lv .tt small{display:block;font-size:11.5px;color:var(--mu);font-weight:700;margin-top:1px}.lv .bs{font-size:12px;color:#9cff9c;font-weight:800}
/* 簡報 */
#brief{background:rgba(8,10,12,.96);align-items:center;justify-content:center;padding:16px;overflow:auto}
.bw{width:100%;max-width:860px;display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center}
.bfimg{width:100%;aspect-ratio:16/10;border-radius:4px;border:1px solid var(--ln)}
.styA{background:linear-gradient(180deg,#3b5a85 0%,#a9b4c4 35%,#f2a35f 52%,#9c7b3c 53%,#6d6a32 100%)}
.styB{background:linear-gradient(180deg,#9aa3ab 0%,#cfd4d8 50%,#e8ecef 51%,#c9ced2 100%)}
.styC{background:linear-gradient(180deg,#2e4a63 0%,#9fb2bf 40%,#f1d3a8 50%,#56664e 51%,#2b3a29 100%)}
#bfNo{font-size:12px;letter-spacing:3px;color:var(--mu);font-weight:800}
#bfTitle{font-size:28px;font-weight:900;margin:4px 0 8px}
#bfText{font-size:14.5px;line-height:1.7;color:#d6dce1}
.gear{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.gear span{font-size:12.5px;font-weight:800;border:1px solid var(--ln);padding:4px 10px;border-radius:3px;background:rgba(255,255,255,.05)}.gear .jm{border-color:#4fe0c8;color:#4fe0c8}
#bfTip{font-size:13px;line-height:1.6;color:#ffd36a;border-left:3px solid #ffd36a;padding-left:10px;margin-bottom:14px}
/* 遊戲 HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:6;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,0) 150px);color:var(--tx);text-shadow:0 1px 2px rgba(0,0,0,.65)}
.tl{position:absolute;left:14px;top:10px}
.tl .m{font-size:11px;letter-spacing:3px;opacity:.8;font-weight:800}
#hudMission{font-size:18px;font-weight:900;margin-top:1px}
#hudGoal{font-size:12px;opacity:.85;font-weight:800}
#hudThreat{font-size:12.5px;font-weight:800;color:var(--c);margin-top:3px}
.meter{width:150px;font-size:11.5px;font-weight:800;margin-top:6px}.meter .bar{height:5px;background:rgba(255,255,255,.22);margin-top:3px}.meter .bar i{display:block;height:100%;width:100%;background:#7fd38a;transition:width .3s}
#expo{background:#ff7a4a!important}
#radar{position:absolute;left:14px;top:118px;width:118px;height:118px}
.tr{position:absolute;right:56px;top:10px;text-align:right;font-weight:800}
.batw{display:inline-flex;align-items:center;gap:6px;font-size:13px}.batw .b{width:46px;height:12px;border:1.5px solid #eef1f3;border-radius:2px;padding:1.5px}.batw .b i{display:block;height:100%;background:#eef1f3}
.spdw{font-size:24px;font-variant-numeric:tabular-nums;margin-top:1px}.spdw small{font-size:11px;opacity:.7}
#ammo{font-size:12.5px;margin-top:2px}#ammo b{font-size:18px;color:var(--c);margin:0 2px}
#marks{position:absolute;inset:0;overflow:hidden}
.brk{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);display:none;--bc:var(--c)}
.brk b{position:absolute;width:30%;height:30%;border-color:var(--bc);border-style:solid}
.brk b:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}.brk b:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}.brk b:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}.brk b:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}
.brk span{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:5px;white-space:nowrap;font-size:11.5px;font-weight:900;color:var(--bc);background:rgba(0,0,0,.4);padding:1px 6px;border-radius:2px}
.brk.tg b{border-width:3px}.brk.tg b:nth-child(1){border-width:3px 0 0 3px}.brk.tg b:nth-child(2){border-width:3px 3px 0 0}.brk.tg b:nth-child(3){border-width:0 0 3px 3px}.brk.tg b:nth-child(4){border-width:0 3px 3px 0}
.brk.lock{background:rgba(255,255,255,.12);outline:2px solid var(--bc)}
.brk.ov b{opacity:.35}.brk.ov span{margin-bottom:34px;opacity:.85}
#meMark{position:absolute;transform:translate(-50%,0);display:none;text-align:center;pointer-events:none}
#meMark i{display:block;margin:0 auto;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #7dff9a;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
#meMark span{display:none;margin-top:3px;font-size:11.5px;font-weight:900;color:#7dff9a;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:2px;white-space:nowrap}
#meMark.new span{display:inline-block}
.lead{position:absolute;width:12px;height:12px;border:2px solid var(--c);border-radius:50%;transform:translate(-50%,-50%);display:none}
.arrow{position:absolute;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--bc,var(--c));display:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#alert{position:absolute;left:50%;top:11%;transform:translateX(-50%);font-size:19px;font-weight:900;white-space:nowrap;background:rgba(10,12,14,.6);padding:3px 14px;border-radius:3px;text-shadow:0 2px 6px rgba(0,0,0,.8);transition:opacity .2s}
#warn{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-size:15px;font-weight:900;color:#ff6a4a;white-space:nowrap;text-shadow:0 0 4px #000,0 0 4px #000}
#oor{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);display:none;flex-direction:column;align-items:center;background:rgba(80,0,0,.55);border:2px solid #ff5a4a;padding:10px 26px;border-radius:4px}
#oor .t{font-size:20px;font-weight:900;color:#ff6a4a;letter-spacing:3px}#oorN{font-size:64px;font-weight:900;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}#oor .s{font-size:13px;font-weight:800;color:#ffd0c8}
#range{position:absolute;right:122px;bottom:150px;font-size:15px;font-weight:900;color:#9cff9c;background:rgba(10,12,14,.6);padding:2px 12px;opacity:0;transition:opacity .15s;letter-spacing:2px}
.ctl{position:fixed;z-index:7}
#joy{left:22px;bottom:20px;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:rgba(0,0,0,.14)}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
.rb{right:22px;width:82px;height:82px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;font-weight:900;font-size:15px;background:rgba(0,0,0,.18);text-shadow:0 1px 2px #000}
.rb.on{background:rgba(255,255,255,.3)}
#bBoost{bottom:26px}#bNet{bottom:122px;right:40px;width:74px;height:74px;font-size:14px}
#bNet.ready{border-color:#9cff9c;color:#9cff9c;box-shadow:0 0 0 3px rgba(156,255,156,.25)}
#bPause{position:fixed;right:52px;top:8px;z-index:7;width:34px;height:34px;border-radius:50%;background:rgba(14,18,22,.7);border:1px solid var(--ln);font-size:13px;font-weight:900}
.tr{right:96px}
#pause{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}#pause.on{display:flex}
#loading{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;font-weight:900;letter-spacing:3px}#loading.on{display:flex}
/* 結果 */
#result{background:rgba(8,10,12,.94);align-items:center;justify-content:center;padding:16px;overflow:auto}
.rw{width:100%;max-width:820px}
#rTitle{font-size:30px;font-weight:900}#rTitle.ok{color:#9cff9c}#rTitle.bad{color:#ff6a4a}
#rWhy{font-size:15px;color:#d6dce1;margin:2px 0 12px;font-weight:700}
#rStats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}#rStats div{border:1px solid var(--ln);border-radius:3px;padding:4px 12px;background:rgba(255,255,255,.04)}#rStats small{display:block;font-size:11px;color:var(--mu)}#rStats b{font-size:20px}#rStats .sc b{color:#9cff9c}
.cost{font-size:14px;line-height:1.6;margin-bottom:10px;border:1px solid rgba(255,211,106,.5);background:rgba(255,211,106,.08);padding:8px 12px;border-radius:3px}.cost b{color:#ffd36a}
.kc{border-left:3px solid var(--c);padding:6px 12px;background:rgba(255,255,255,.04);margin-bottom:14px}.kc small{font-size:11px;letter-spacing:2px;color:var(--mu);font-weight:800}.kc h4{font-size:16px;margin:2px 0 4px}.kc p{font-size:13.5px;line-height:1.65;color:#d6dce1}.kc .src{font-size:11.5px;color:var(--mu);margin-top:4px}
.rbtn{display:flex;gap:8px;flex-wrap:wrap}
/* 循環 */
#cycle{background:#0c0f12;align-items:center;justify-content:center;flex-direction:column;padding:16px;overflow:auto;gap:14px}
#cycle h2{font-size:22px;font-weight:900;letter-spacing:2px}
#cyGrid{display:flex;align-items:stretch;gap:6px;max-width:1000px;width:100%}
.cy{flex:1;border:1px solid var(--ln);border-radius:4px;padding:10px;background:rgba(255,255,255,.04)}.cy b{font-size:13px;color:var(--mu)}.cy h4{font-size:14.5px;margin:3px 0}.cy p{font-size:12px;line-height:1.5;color:#c9d1d9}.cy.q{border-color:#ffd36a}.cy.q h4{color:#ffd36a}
.ar{font-style:normal;align-self:center;color:var(--mu);font-weight:900}
#settings{background:rgba(8,10,12,.96);align-items:center;justify-content:center;flex-direction:column;gap:14px}
.seg{display:flex;gap:6px}.seg button{border:1.5px solid var(--ln);background:transparent;padding:8px 16px;border-radius:3px;font-weight:800}.seg button.on{border-color:var(--tx);background:rgba(255,255,255,.12)}
#rot{display:none}
@media (orientation:portrait){
 #range{right:20px;bottom:236px}#alert{top:24%;font-size:16px}
 .mw,.bw{grid-template-columns:1fr}.mh h1{font-size:32px}.bfimg{display:none}
 #cyGrid{flex-direction:column}.ar{transform:rotate(90deg)}
 #radar{width:96px;height:96px;top:auto;bottom:160px;left:14px}
 .tr{right:14px;top:52px}#joy{width:110px;height:110px}#knob{left:33px;top:33px}
 #rot{display:block;position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mu);z-index:7}
}
</style></head><body>
<div id="view"></div><div class="vig"></div>
<button id="mute">🔊</button>
<section class="scr on" id="menu"><div class="mw"><div class="mh"><small>課堂手機遊戲・無人機段落</small><h1>矛與盾<em>：攔截</em></h1>
 <p>敵方的無人機一波一波飛來。這次你操控的是<b>攔截無人機</b>：撞下它們，或用捕捉網網住它們。<br>六關，三種戰場，每關結束都有一張真實世界的知識卡。</p>
 <div class="row"><button class="btn gh" id="bCycle">矛與盾的循環</button><button class="btn gh" id="bSet">設定</button></div>
 <p style="font-size:11.5px;color:var(--mu);margin-top:12px">陣營、地點、武器造型皆為虛構。建議把手機橫過來玩。</p></div>
 <div id="lvList"></div></div></section>
<section class="scr" id="brief"><div class="bw"><canvas class="bfimg" id="bfImg" width="640" height="400"></canvas><div>
 <div id="bfNo"></div><div id="bfTitle"></div><div id="bfText"></div><div class="gear" id="bfGear"></div><div id="bfTip"></div>
 <div class="rbtn"><button class="btn" id="bGo">開始</button><button class="btn gh" id="bBack">返回</button></div>
 <p style="font-size:12px;color:var(--mu);margin-top:10px">左手推桿控制方向（往上推＝抬頭），右手按住「衝刺」加速；衝刺時比較難轉彎、也比較耗電。</p></div></div></section>
<section class="scr" id="game">
 <div id="hud"><div id="marks"></div><div id="meMark"><i></i><span>你的攔截機</span></div>
  <div class="tl"><div class="m">攔截任務</div><div id="hudMission"></div><div id="hudGoal"></div><div id="hudThreat"></div>
   <div class="meter" id="hpBox"><span id="assetName"></span><div class="bar"><i id="hp"></i></div></div>
   <div class="meter" id="expoBox">暴露程度 <span id="expoT"></span><div class="bar"><i id="expo"></i></div></div></div>
  <canvas id="radar" width="236" height="236"></canvas>
  <div class="tr"><div class="batw"><span class="b"><i id="bat"></i></span><span id="batT"></span></div><div class="spdw"><span id="spd"></span> <small>公里/時</small></div><div id="ammo"></div></div>
  <div id="alert"></div><div id="warn"></div><div id="oor"><div class="t">超出遙控範圍</div><div id="oorN">5</div><div class="s">5 秒內沒有飛回範圍，遊戲結束</div></div><div id="range">網子射程內</div>
 </div>
 <div class="ctl" id="joy"><div id="knob"></div></div>
 <button class="ctl rb" id="bBoost">衝刺</button><button class="ctl rb" id="bNet">發射網</button>
 <button id="bPause">❚❚</button><div id="rot">把手機橫放，視野更寬、操作更順手</div>
</section>
<div id="pause"><div style="font-size:22px;font-weight:900;margin-bottom:6px">暫停</div><button class="btn" id="pResume">繼續</button><button class="btn gh" id="pRetry">重新開始</button><button class="btn gh" id="pMenu">回到選單</button></div>
<div id="loading">載入戰場中…</div>
<section class="scr" id="result"><div class="rw"><div id="rTitle"></div><div id="rWhy"></div><div id="rStats"></div><div id="rCard"></div>
 <div class="rbtn"><button class="btn" id="rNext">下一關</button><button class="btn gh" id="rCycle">看矛與盾的循環</button><button class="btn gh" id="rRetry">再玩一次</button><button class="btn gh" id="rMenu">選單</button></div></div></section>
<section class="scr" id="cycle"><h2>矛與盾的循環</h2><div id="cyGrid"></div><button class="btn gh" id="cyBack">回到選單</button></section>
<section class="scr" id="settings"><h2 style="font-size:20px">設定</h2><div>推桿靈敏度</div><div class="seg" id="stSens"></div><div>畫質</div><div class="seg" id="stQ"></div><button class="btn gh" id="stBack">完成</button></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== 場景（三種風格） =====================
const STYLES={
 A:{name:'黃昏農田',sky:[0x1d3557,0x6c8cb5,0xffb26b],sun:0xffc48a,sunI:2.3,hemi:[0x9cb7d8,0x5a4630,.6],fog:0xd9a576,fogD:[140,1100],sunDir:[-.58,.11,-.81],ground:'farm',tree:[0x3f5228,0x56662f],snow:0,c:'#ffb648',hill:6,asset:'artillery'},
 B:{name:'冬季雪原',sky:[0x8e98a3,0xb9c1c8,0xd4d8db],sun:0xe8edf2,sunI:.95,hemi:[0xdde4ea,0x8a9096,1.05],fog:0xc3c9ce,fogD:[80,850],sunDir:[.4,.55,-.73],ground:'snow',tree:[0x1f2a24,0x2c352d],snow:1,c:'#ff5a3c',hill:4,asset:'depot'},
 C:{name:'山谷晨霧',sky:[0x24405a,0x7d98ad,0xf3d2a6],sun:0xffe0b8,sunI:1.8,hemi:[0x9fb5c6,0x2f3b2c,.62],fog:0xa9b8bd,fogD:[70,900],sunDir:[.6,.07,-.8],ground:'forest',tree:[0x22361f,0x2f4628],snow:0,c:'#54e3c9',hill:38,asset:'bridge'}};
let P=STYLES.A,STY='A',WSEED=11;
const wr=()=>{WSEED=(WSEED*16807)%2147483647;return(WSEED-1)/2147483646};
function hgt(x,z){let h=Math.sin(x*.006)*Math.cos(z*.005)*P.hill+Math.sin(x*.017+1.3)*Math.sin(z*.013)*P.hill*.35+Math.sin(x*.05)*Math.cos(z*.043)*1.2;
 if(STY==='C'){const v=Math.abs(z)/170;h=h*Math.min(1,v)+(v<1?-7*(1-v)*(1-v):0)+ (v>=1?(v-1)*14:0);}
 const d=Math.hypot(x,z);if(d<70&&STY!=='C')h*=d/70; // 陣地附近平坦
 return h;}
function groundTex(){const c=document.createElement('canvas');c.width=c.height=2048;const g=c.getContext('2d');
 if(P.ground==='farm'){const cols=['#c9a24a','#b8913f','#7d7a3a','#9a8a48','#d4b35c','#6f6a32','#a07a3c','#58612c'];g.fillStyle='#8a7a40';g.fillRect(0,0,2048,2048);
  for(let i=0;i<14;i++)for(let j=0;j<10;j++){const x=i*146+wr()*10,y=j*205+wr()*10,w=146,h=205;g.fillStyle=cols[Math.floor(wr()*cols.length)];g.fillRect(x,y,w-4,h-4);
   g.globalAlpha=.07;g.strokeStyle='#000';for(let k=0;k<w;k+=6){g.beginPath();g.moveTo(x+k,y);g.lineTo(x+k,y+h-4);g.stroke();}g.globalAlpha=1;
   if(wr()<.18){g.fillStyle='#3f3a22';for(let k=0;k<120;k++){g.globalAlpha=.25;g.fillRect(x+wr()*w,y+wr()*h,3,3);}g.globalAlpha=1;}}
  for(let k=0;k<40;k++){const x=wr()*2048,y=wr()*2048;const gr=g.createRadialGradient(x,y,0,x,y,6+wr()*8);gr.addColorStop(0,'rgba(50,35,20,.7)');gr.addColorStop(1,'rgba(50,35,20,0)');g.fillStyle=gr;g.fillRect(x-20,y-20,40,40);}}

function autopilot(){const me=G.me;if(G.dead)return{jx:0,jy:0,boost:false,fire:false};let tg=null,bs=1e9;
